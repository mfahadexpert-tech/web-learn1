<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Buttons Example - WebLearn</title>

    <!-- ================= INTERNAL CSS ================= -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f9fafb;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            border: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111827;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Standard Button Base */
        button {
            padding: 12px 20px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Button Colors */
        .btn-primary {
            background-color: #16a34a;
            color: white;
        }

        .btn-secondary {
            background-color: #111827;
            color: white;
        }

        .btn-danger {
            background-color: #dc2626;
            color: white;
        }

        .btn-outline {
            background-color: transparent;
            color: #16a34a;
            border: 2px solid #16a34a;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #16a34a;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Basic Buttons Example</h1>
        <p>A collection of standard buttons styled using CSS classes.</p>

        <div class="button-group">
            <button class="btn-primary" type="button">Primary Button</button>
            <button class="btn-secondary" type="button">Secondary Button</button>
            <button class="btn-danger" type="button">Danger Button</button>
            <button class="btn-outline" type="button">Outline Button</button>
        </div>

        <a href="../../index.html" class="back-link">Back to Home</a>
    </div>

</body>

</html>
