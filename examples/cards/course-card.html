<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Card Example - WebLearn</title>

    <!-- ================= INTERNAL CSS STYLES ================= -->
    <style>
        /* CSS Reset and Global Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Centered Background */
        body {
            background: #f9fafb;
            padding: 40px 20px;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Card Container with Shadow & Hover Animation */
        .card-container {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        /* Card Top Banner / Badge */
        .card-banner {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .card-banner h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .card-banner span {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Card Content Body */
        .card-body {
            padding: 24px;
        }

        .card-body p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        /* Feature Bullet List */
        .card-features {
            list-style: none;
            margin-bottom: 24px;
        }

        .card-features li {
            padding: 6px 0;
            font-size: 14px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-features li::before {
            content: "✓";
            color: #16a34a;
            font-weight: bold;
        }

        /* Primary Action Button */
        .card-btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background-color: #111827;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .card-btn:hover {
            background-color: #16a34a;
        }

        /* Back Link */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #16a34a;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Main Course Card Component -->
    <div class="card-container">

        <!-- Header Banner -->
        <div class="card-banner">
            <span>Beginner Course</span>
            <h2>HTML &amp; CSS Essentials</h2>
        </div>

        <!-- Card Body -->
        <div class="card-body">
            <p>Master the fundamentals of structuring and styling web pages from scratch.</p>

            <!-- Key Features List -->
            <ul class="card-features">
                <li>10 Practical Lessons</li>
                <li>Interactive Code Examples</li>
                <li>Responsive Design Basics</li>
            </ul>

            <!-- Call to Action Button -->
            <a href="../../html/html-introduction.html" class="card-btn">Start Learning Now</a>

            <!-- Return Navigation Link -->
            <a href="../../index.html#examples" class="back-link">← Back to Examples</a>
        </div>

    </div>

</body>

</html>
