<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5b9c" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#f8fafc" />

  <!-- Browser Header -->
  <rect width="800" height="34" fill="#1e293b" />
  <circle cx="22" cy="17" r="5" fill="#ef4444" />
  <circle cx="38" cy="17" r="5" fill="#f59e0b" />
  <circle cx="54" cy="17" r="5" fill="#10b981" />
  <rect x="250" y="8" width="300" height="18" rx="9" fill="#0f172a" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">HTML5 Form with Validation &amp; Datalist Preview</text>

  <!-- Title Card -->
  <g transform="translate(140, 50)" filter="url(#shadow)">
    <rect width="520" height="42" rx="8" fill="url(#purpleGrad)" />
    <text x="260" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Form Controls, Pattern Validation &amp; Datalist</text>
  </g>

  <!-- Form Body with Fieldset -->
  <g transform="translate(140, 108)" filter="url(#shadow)">
    <rect width="520" height="345" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Fieldset border -->
    <rect x="25" y="20" width="470" height="305" rx="6" fill="none" stroke="#2b5b9c" stroke-width="2" />
    
    <!-- Legend -->
    <rect x="50" y="10" width="110" height="20" fill="#ffffff" />
    <text x="105" y="24" fill="#2b5b9c" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Form to fill</text>

    <!-- Field 1: Username & Register -->
    <text x="45" y="52" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Username:</text>
    <rect x="45" y="58" width="200" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="55" y="73" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">user@example.com (autofocus)</text>

    <text x="270" y="52" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">REGISTER (pattern):</text>
    <rect x="270" y="58" width="205" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="280" y="73" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">FA24-BSSE-067</text>

    <!-- Field 2: Password & Age -->
    <text x="45" y="98" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Password:</text>
    <rect x="45" y="104" width="200" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="55" y="119" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">••••••••</text>

    <text x="270" y="98" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Age (10-20, step 5):</text>
    <rect x="270" y="104" width="205" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="280" y="119" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="9">15</text>

    <!-- Field 3: Cities Datalist & Phone Readonly -->
    <text x="45" y="144" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Cities (Datalist):</text>
    <rect x="45" y="150" width="200" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="55" y="165" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="9">Vehari, Multan, Islamabad ▼</text>

    <text x="270" y="144" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Phone (Read-Only):</text>
    <rect x="270" y="150" width="205" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="280" y="165" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">+92-3001234567 🔒</text>

    <!-- Field 4: Search & URL Disabled -->
    <text x="45" y="190" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">SEARCH:</text>
    <rect x="45" y="196" width="200" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="55" y="211" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">Search keywords...</text>

    <text x="270" y="190" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Website URL (Disabled):</text>
    <rect x="270" y="196" width="205" height="22" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
    <text x="280" y="211" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">https://disabled-example.com 🚫</text>

    <!-- Field 5: Gender & Date -->
    <text x="45" y="234" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">GENDER:</text>
    <circle cx="52" cy="248" r="5" fill="#2b5b9c" />
    <circle cx="52" cy="248" r="2" fill="#ffffff" />
    <text x="64" y="252" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">Male</text>

    <circle cx="110" cy="248" r="5" fill="#ffffff" stroke="#cbd5e1" />
    <text x="122" y="252" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">Female</text>

    <text x="270" y="234" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">DATE:</text>
    <rect x="270" y="240" width="205" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="280" y="255" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="9">2026-10-15 📅</text>

    <!-- Field 6: Country & Address -->
    <text x="45" y="278" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Country:</text>
    <rect x="95" y="268" width="150" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="105" y="282" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="9">Select a country ▼</text>

    <text x="270" y="278" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Address:</text>
    <rect x="325" y="268" width="150" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="335" y="282" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">Street address</text>

    <!-- Submit Button -->
    <rect x="45" y="296" width="430" height="22" rx="4" fill="#2b5b9c" />
    <text x="260" y="311" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Register</text>
  </g>
</svg>
