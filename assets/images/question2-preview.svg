<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5b9c" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#f8fafc" />

  <!-- Browser Header -->
  <rect width="800" height="34" fill="#1e293b" />
  <circle cx="22" cy="17" r="5" fill="#ef4444" />
  <circle cx="38" cy="17" r="5" fill="#f59e0b" />
  <circle cx="54" cy="17" r="5" fill="#10b981" />
  <rect x="250" y="8" width="300" height="18" rx="9" fill="#0f172a" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Geological Eras &amp; Events Table Preview</text>

  <!-- Title Card -->
  <g transform="translate(150, 50)" filter="url(#shadow)">
    <rect width="500" height="45" rx="8" fill="url(#blueGrad)" />
    <text x="250" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">HTML Table with Colspan &amp; Rowspan</text>
  </g>

  <!-- Table Container Card -->
  <g transform="translate(150, 115)" filter="url(#shadow)">
    <rect width="500" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Table Header Row -->
    <rect x="35" y="25" width="140" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <text x="105" y="49" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ereas</text>

    <!-- Colspan=2 Header -->
    <rect x="175" y="25" width="290" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <text x="320" y="49" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">events (colspan="2")</text>

    <!-- Row 1: mesozoic | evolution | 235 -->
    <rect x="35" y="63" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="105" y="86" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">mesozoic</text>
    <rect x="175" y="63" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="86" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">evolution</text>
    <rect x="325" y="63" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="86" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">235</text>

    <!-- Row 2 & 3: rowspan="2" events | away africa | 135 -->
    <rect x="35" y="99" width="140" height="72" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="105" y="140" fill="#2b5b9c" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">events (rowspan="2")</text>
    
    <rect x="175" y="99" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="122" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">away africa</text>
    <rect x="325" y="99" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="122" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">135</text>

    <rect x="175" y="135" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="158" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">away africa</text>
    <rect x="325" y="135" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="158" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">135</text>

    <!-- Row 4, 5 & 6: rowspan="3" events | away africa | 135 -->
    <rect x="35" y="171" width="140" height="108" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="105" y="230" fill="#2b5b9c" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">events (rowspan="3")</text>

    <rect x="175" y="171" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="194" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">away africa</text>
    <rect x="325" y="171" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="194" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">135</text>

    <rect x="175" y="207" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="230" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">away africa</text>
    <rect x="325" y="207" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="230" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">135</text>

    <rect x="175" y="243" width="150" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="250" y="266" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">away africa</text>
    <rect x="325" y="243" width="140" height="36" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <text x="395" y="266" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">135</text>

    <!-- Hint Footer -->
    <text x="250" y="302" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">✨ Click to view full HTML source and test resizable split view</text>
  </g>
</svg>
