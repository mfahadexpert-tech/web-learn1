<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flexHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04aa6d" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="frogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04aa6d" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#090e1a" />

  <!-- Browser Header -->
  <rect width="800" height="34" fill="#0f172a" />
  <circle cx="20" cy="17" r="5" fill="#ef4444" />
  <circle cx="36" cy="17" r="5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="5" fill="#10b981" />
  <rect x="220" y="8" width="360" height="18" rx="9" fill="#1e293b" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">w3schools.com/css/css_flexbox_game.asp</text>

  <!-- W3Schools Top Bar -->
  <g transform="translate(30, 48)" filter="url(#shadow)">
    <rect width="740" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="16" y="10" width="34" height="26" rx="4" fill="#04aa6d" />
    <text x="33" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">W3</text>
    <text x="62" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">CSS Flexbox Game: Target Alignment Challenge</text>
    
    <!-- Level Pills -->
    <rect x="520" y="12" width="62" height="22" rx="4" fill="#04aa6d" />
    <text x="551" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 1 &#10003;</text>
    <rect x="590" y="12" width="62" height="22" rx="4" fill="#334155" />
    <text x="621" y="27" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 2</text>
    <rect x="660" y="12" width="62" height="22" rx="4" fill="#334155" />
    <text x="691" y="27" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 3</text>
  </g>

  <!-- Left Side: Instructions & Code Input -->
  <g transform="translate(30, 108)" filter="url(#shadow)">
    <rect width="360" height="365" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">&#127918; Challenge: Align Frogs to Target Zones</text>
    <text x="20" y="52" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Help both items jump into the target circles on the right!</text>
    <text x="20" y="68" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Use justify-content along the horizontal main axis,</text>
    <text x="20" y="84" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">and align-items along the vertical cross axis.</text>

    <!-- Rule Callout -->
    <rect x="20" y="96" width="320" height="42" rx="4" fill="rgba(4, 170, 109, 0.12)" stroke="#04aa6d" stroke-width="1" />
    <text x="30" y="113" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">&#128161; Flex Alignment Rule:</text>
    <text x="30" y="128" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="9">justify-content: flex-end; &#8226; align-items: center;</text>

    <!-- Code Editor Box -->
    <rect x="20" y="150" width="320" height="152" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="172" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">#flex-pond {</text>
    <text x="44" y="194" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">display: flex;</text>
    
    <text x="44" y="220" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">justify-content: <tspan fill="#6ee7b7" font-weight="bold">flex-end</tspan>;</text>
    <text x="44" y="246" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">align-items:     <tspan fill="#6ee7b7" font-weight="bold">center</tspan>;</text>
    
    <text x="32" y="278" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">}</text>

    <!-- Pass Button -->
    <rect x="20" y="314" width="320" height="36" rx="6" fill="url(#greenBtn)" />
    <text x="180" y="336" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">&#10003; Level 1 Passed &#8226; Targets Aligned!</text>
  </g>

  <!-- Right Side: Pond Canvas with Targets and Frogs -->
  <g transform="translate(410, 108)" filter="url(#shadow)">
    <rect width="360" height="365" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="180" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">FLEX CONTAINER CANVAS (#FLEX-POND)</text>

    <g transform="translate(25, 42)">
      <rect width="310" height="260" rx="8" fill="#090e1a" stroke="#334155" stroke-width="2" />
      
      <!-- Axis Arrows -->
      <!-- Main Axis (X) -->
      <line x1="20" y1="18" x2="290" y2="18" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4" />
      <text x="155" y="14" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Main Axis (justify-content: flex-end &#8594;)</text>

      <!-- Cross Axis (Y) -->
      <line x1="298" y1="20" x2="298" y2="240" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" />

      <!-- Target Pad 1 (Dashed Green Circle) -->
      <circle cx="240" cy="95" r="32" fill="rgba(4, 170, 109, 0.15)" stroke="#04aa6d" stroke-width="2" stroke-dasharray="4,4" />
      <!-- Target Pad 2 (Dashed Green Circle) -->
      <circle cx="240" cy="170" r="32" fill="rgba(4, 170, 109, 0.15)" stroke="#04aa6d" stroke-width="2" stroke-dasharray="4,4" />

      <!-- Aligned Frog 1 -->
      <circle cx="240" cy="95" r="28" fill="url(#frogGrad)" stroke="#6ee7b7" stroke-width="2" />
      <text x="240" y="93" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" text-anchor="middle">&#128056;</text>
      <text x="240" y="112" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Frog 1</text>

      <!-- Aligned Frog 2 -->
      <circle cx="240" cy="170" r="28" fill="url(#frogGrad)" stroke="#6ee7b7" stroke-width="2" />
      <text x="240" y="168" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" text-anchor="middle">&#128056;</text>
      <text x="240" y="187" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Frog 2</text>

      <!-- Left ghost start positions -->
      <circle cx="55" cy="95" r="22" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="55" y="99" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">start</text>
      <circle cx="55" cy="170" r="22" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="55" y="174" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="8" text-anchor="middle">start</text>
    </g>

    <!-- Success Toast Notification -->
    <rect x="25" y="318" width="310" height="32" rx="6" fill="#064e3b" stroke="#04aa6d" stroke-width="1" />
    <text x="180" y="338" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">&#127881; SUCCESS: Frogs Successfully Aligned to Target Zones!</text>
  </g>
</svg>
