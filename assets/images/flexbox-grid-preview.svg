<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="#f8fafc" />

  <!-- Browser Header Window -->
  <rect width="800" height="34" fill="#0f172a" />
  <circle cx="20" cy="17" r="5" fill="#ef4444" />
  <circle cx="36" cy="17" r="5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="5" fill="#10b981" />
  <rect x="220" y="8" width="360" height="18" rx="9" fill="#1e293b" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Flexbox &amp; CSS Grid Complete Practice Lab Preview</text>

  <!-- Top Hero Banner -->
  <g transform="translate(30, 48)" filter="url(#cardShadow)">
    <rect width="740" height="54" rx="8" fill="url(#headerGrad)" />
    <text x="370" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Flexbox &amp; CSS Grid Mastery Lab</text>
    <text x="370" y="44" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">15 Practice Tasks: Sizing, Axis Dynamics, Slices, and 2D Spatial Grids</text>
  </g>

  <!-- Section 1: Flexbox Navigation Bar -->
  <g transform="translate(30, 114)" filter="url(#cardShadow)">
    <rect width="740" height="42" rx="6" fill="#0f172a" />
    <text x="20" y="26" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12">&lt;/&gt; WebTech<tspan fill="#38bdf8">Lab</tspan></text>
    <text x="220" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Home</text>
    <text x="290" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Products</text>
    <text x="370" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Dashboard</text>
    <text x="460" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Docs</text>
    <rect x="650" y="10" width="75" height="22" rx="4" fill="#2563eb" />
    <text x="687" y="25" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Login</text>
  </g>

  <!-- Section 2: 4 Flex Items (Colored Cards) -->
  <g transform="translate(30, 168)">
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="175" height="58" rx="6" fill="url(#redGrad)" />
      <text x="87" y="34" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Card 1: Crimson</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="188" y="0" width="175" height="58" rx="6" fill="url(#blueGrad)" />
      <text x="275" y="34" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Card 2: Azure</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="376" y="0" width="175" height="58" rx="6" fill="url(#greenGrad)" />
      <text x="463" y="34" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Card 3: Emerald</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="565" y="0" width="175" height="58" rx="6" fill="url(#purpleGrad)" />
      <text x="652" y="34" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Card 4: Amethyst</text>
    </g>
  </g>

  <!-- Section 3: CSS Grid Dashboard (3 cols x 2 rows) & Spanning -->
  <g transform="translate(30, 238)">
    <!-- Column 1 & 2: CSS Grid 3x2 Matrix -->
    <g filter="url(#cardShadow)">
      <rect width="460" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="16" y="24" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">CSS Grid: 3 Columns x 2 Rows Dashboard</text>
      
      <!-- Row 1 -->
      <rect x="16" y="36" width="134" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="83" y="60" fill="#2563eb" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2,420 Users</text>

      <rect x="162" y="36" width="134" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="229" y="60" fill="#16a34a" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">$18.4k Revenue</text>

      <rect x="308" y="36" width="136" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="376" y="60" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">99.9% Uptime</text>

      <!-- Row 2 -->
      <rect x="16" y="82" width="134" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="83" y="106" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">14 Alerts</text>

      <rect x="162" y="82" width="134" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="229" y="106" fill="#8b5cf6" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">580 Uploads</text>

      <rect x="308" y="82" width="136" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="376" y="106" fill="#06b6d4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Secured</text>
    </g>

    <!-- Column 3: Grid Line Placement Spanning -->
    <g transform="translate(480, 0)" filter="url(#cardShadow)">
      <rect width="260" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">Grid Spanning Layout</text>
      
      <rect x="14" y="36" width="150" height="26" rx="4" fill="#3b82f6" />
      <text x="89" y="52" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Span 3 Cols</text>

      <rect x="172" y="36" width="74" height="86" rx="4" fill="#8b5cf6" />
      <text x="209" y="80" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Span 2 Rows</text>

      <rect x="14" y="68" width="46" height="24" rx="3" fill="#e2e8f0" />
      <rect x="66" y="68" width="46" height="24" rx="3" fill="#e2e8f0" />
      <rect x="118" y="68" width="46" height="24" rx="3" fill="#e2e8f0" />

      <rect x="14" y="98" width="46" height="24" rx="3" fill="#e2e8f0" />
      <rect x="66" y="98" width="46" height="24" rx="3" fill="#e2e8f0" />
      <rect x="118" y="98" width="46" height="24" rx="3" fill="#e2e8f0" />
    </g>
  </g>

  <!-- Section 4: Fractional Units & Axis Flow -->
  <g transform="translate(30, 386)" filter="url(#cardShadow)">
    <rect width="740" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- 1fr vs 3fr -->
    <text x="20" y="24" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11">Fractional Units (fr): 800px Width Distribution</text>
    <rect x="20" y="34" width="120" height="32" rx="4" fill="#2563eb" />
    <text x="80" y="54" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sidebar: 1fr (200px)</text>

    <rect x="148" y="34" width="360" height="32" rx="4" fill="#0f172a" />
    <text x="328" y="54" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Main Content Area: 3fr (600px)</text>
    
    <text x="20" y="82" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Total units = 1fr + 3fr = 4fr &#8226; 800px / 4 = 200px per fr &#8226; Sidebar = 200px, Main = 600px</text>

    <!-- Main Axis vs Cross Axis summary -->
    <rect x="525" y="16" width="195" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="535" y="36" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="10">Axis Dynamics:</text>
    <text x="535" y="52" fill="#2563eb" font-family="'Segoe UI', sans-serif" font-size="9">&#8226; row: Main = X (horiz), Cross = Y (vert)</text>
    <text x="535" y="68" fill="#16a34a" font-family="'Segoe UI', sans-serif" font-size="9">&#8226; column: Main = Y (vert), Cross = X (horiz)</text>
  </g>
</svg>
