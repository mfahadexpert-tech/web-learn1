<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Georgia, serif; font-size: 34px; font-weight: bold; fill: #000000; }
      .subtext { font-family: 'Times New Roman', Georgia, serif; font-size: 16px; fill: #111111; }
      .label { font-family: 'Times New Roman', Georgia, serif; font-size: 16px; fill: #111111; }
      .placeholder { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
      .link { font-family: 'Times New Roman', Georgia, serif; font-size: 15px; fill: #0000ee; text-decoration: underline; }
      .btn-text { font-family: Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="700" height="480" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="16" y="42" class="title">Singn up</text>
  <text x="16" y="78" class="subtext">Please fill this form</text>
  <line x1="16" y1="92" x2="684" y2="92" stroke="#eeeeee" stroke-width="1"/>

  <!-- Password -->
  <text x="16" y="125" class="label">Password</text>
  <rect x="16" y="136" width="668" height="38" fill="#f1f3f5" stroke="#cccccc" stroke-width="1"/>
  <text x="32" y="160" class="placeholder">Enter your password</text>

  <!-- Email -->
  <text x="16" y="208" class="label">Email</text>
  <rect x="16" y="219" width="668" height="38" fill="#f1f3f5" stroke="#cccccc" stroke-width="1"/>
  <text x="32" y="243" class="placeholder">Enter your email</text>

  <!-- Repeat Password -->
  <text x="16" y="291" class="label">Repeat password</text>
  <rect x="16" y="302" width="668" height="38" fill="#f1f3f5" stroke="#cccccc" stroke-width="1"/>
  <text x="32" y="326" class="placeholder">Repeat your password</text>

  <!-- Checkbox & Terms -->
  <text x="16" y="374" class="subtext">Remember me</text>
  <rect x="115" y="361" width="13" height="13" fill="#ffffff" stroke="#767676" stroke-width="1" rx="2"/>
  
  <text x="16" y="407" class="subtext">By pressing yes you agree to <tspan fill="#0000ee" text-decoration="underline">term &amp; conditions</tspan></text>

  <!-- Buttons: Cancel (Green) and Signup (Dark Red/Brown) -->
  <rect x="16" y="426" width="334" height="42" fill="#008000"/>
  <text x="183" y="452" class="btn-text">Cancel</text>

  <rect x="350" y="426" width="334" height="42" fill="#662211"/>
  <text x="517" y="452" class="btn-text">Signup</text>
</svg>
