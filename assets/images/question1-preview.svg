<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Browser Header Bar -->
  <rect width="800" height="34" fill="#0f172a" />
  <circle cx="22" cy="17" r="5" fill="#ef4444" />
  <circle cx="38" cy="17" r="5" fill="#f59e0b" />
  <circle cx="54" cy="17" r="5" fill="#10b981" />
  <rect x="240" y="8" width="320" height="18" rx="9" fill="#1e293b" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Responsive Form &amp; Website Footer Preview</text>

  <!-- Form Header Card -->
  <g transform="translate(140, 50)" filter="url(#shadow)">
    <rect width="520" height="40" rx="8" fill="url(#goldGrad)" />
    <text x="260" y="26" fill="#111827" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Responsive Form</text>
  </g>

  <!-- Form Body Card -->
  <g transform="translate(140, 105)" filter="url(#shadow)">
    <rect width="520" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Row 1: First Name -->
    <text x="30" y="32" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">First Name</text>
    <rect x="140" y="16" width="350" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="150" y="32" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Your name..</text>

    <!-- Row 2: Last Name -->
    <text x="30" y="68" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Last Name</text>
    <rect x="140" y="52" width="350" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="150" y="68" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Your last name..</text>

    <!-- Row 3: Country -->
    <text x="30" y="104" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Country</text>
    <rect x="140" y="88" width="350" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="150" y="104" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="10">Pakistan</text>

    <!-- Row 4: Subject -->
    <text x="30" y="140" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Subject</text>
    <rect x="140" y="124" width="350" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="150" y="142" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Write something..</text>

    <!-- Submit Button -->
    <rect x="410" y="162" width="80" height="20" rx="4" fill="url(#goldGrad)" />
    <text x="450" y="176" fill="#111827" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Submit</text>
  </g>

  <!-- Dark Footer Preview -->
  <g transform="translate(0, 310)">
    <path d="M 0 20 Q 400 0 800 20 L 800 170 L 0 170 Z" fill="#0f172a" />
    <line x1="0" y1="20" x2="800" y2="20" stroke="#ffd700" stroke-width="3" />
    
    <!-- Col 1 -->
    <text x="60" y="55" fill="#ffd700" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">&lt;/&gt; Fahad WebTech</text>
    <text x="60" y="75" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">Building responsive, modern web interfaces.</text>
    <circle cx="70" cy="100" r="10" fill="#1e293b" stroke="#ffd700" stroke-width="1" />
    <circle cx="95" cy="100" r="10" fill="#1e293b" stroke="#ffd700" stroke-width="1" />
    <circle cx="120" cy="100" r="10" fill="#1e293b" stroke="#ffd700" stroke-width="1" />

    <!-- Col 2 -->
    <text x="260" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">QUICK LINKS</text>
    <line x1="260" y1="62" x2="290" y2="62" stroke="#ffd700" stroke-width="2" />
    <text x="260" y="80" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">&gt; Home</text>
    <text x="260" y="96" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">&gt; Projects</text>
    <text x="260" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">&gt; Contact</text>

    <!-- Col 3 -->
    <text x="420" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">GET IN TOUCH</text>
    <line x1="420" y1="62" x2="450" y2="62" stroke="#ffd700" stroke-width="2" />
    <text x="420" y="80" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">📍 Tech Campus, Pakistan</text>
    <text x="420" y="96" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">✉️ haji@gmail.com</text>
    <text x="420" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">📞 +92 300 1234567</text>

    <!-- Col 4: Leave Comments Form -->
    <rect x="580" y="38" width="160" height="95" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="590" y="52" fill="#ffd700" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">LEAVE COMMENTS</text>
    <rect x="590" y="58" width="140" height="16" rx="3" fill="#0f172a" />
    <rect x="590" y="78" width="140" height="16" rx="3" fill="#0f172a" />
    <rect x="590" y="100" width="140" height="20" rx="3" fill="url(#goldGrad)" />
    <text x="660" y="114" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Send Message</text>

    <!-- Copyright -->
    <rect y="145" width="800" height="25" fill="#090e1a" />
    <text x="400" y="161" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">&#169; 2026 Fahad WebTech. All Rights Reserved.</text>
  </g>
</svg>
