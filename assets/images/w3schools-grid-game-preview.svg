<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gridHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04aa6d" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="activeBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04aa6d" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#090e1a" />

  <!-- Browser Chrome Bar -->
  <rect width="800" height="34" fill="#0f172a" />
  <circle cx="20" cy="17" r="5" fill="#ef4444" />
  <circle cx="36" cy="17" r="5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="5" fill="#10b981" />
  <rect x="220" y="8" width="360" height="18" rx="9" fill="#1e293b" />
  <text x="400" y="21" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">w3schools.com/css/css_grid_game.asp</text>

  <!-- W3Schools Top Bar -->
  <g transform="translate(30, 48)" filter="url(#shadow)">
    <rect width="740" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="16" y="10" width="34" height="26" rx="4" fill="#04aa6d" />
    <text x="33" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">W3</text>
    <text x="62" y="29" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="14">CSS Grid Game: Box Counting &amp; Line Placement</text>
    
    <!-- Level Pills -->
    <rect x="520" y="12" width="62" height="22" rx="4" fill="#04aa6d" />
    <text x="551" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 1 &#10003;</text>
    <rect x="590" y="12" width="62" height="22" rx="4" fill="#334155" />
    <text x="621" y="27" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 2</text>
    <rect x="660" y="12" width="62" height="22" rx="4" fill="#334155" />
    <text x="691" y="27" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Level 3</text>
  </g>

  <!-- Left Side: Instructions & Code Input -->
  <g transform="translate(30, 108)" filter="url(#shadow)">
    <rect width="360" height="365" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13">&#127918; Challenge: Count Grid Boxes from Start to End</text>
    <text x="20" y="52" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Count the grid lines: [1], [2], [3], [4], [5].</text>
    <text x="20" y="68" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Start at Box 1 (Line 1) and end at Box 3 (Line 4),</text>
    <text x="20" y="84" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">spanning 3 counted boxes horizontally!</text>

    <!-- Formula Box -->
    <rect x="20" y="96" width="320" height="42" rx="4" fill="rgba(4, 170, 109, 0.12)" stroke="#04aa6d" stroke-width="1" />
    <text x="30" y="113" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">&#128161; CSS Line Counting Rule:</text>
    <text x="30" y="128" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="9">grid-column: 1 / 4; (Starts at Line 1 &#8226; Ends at Line 4)</text>

    <!-- Code Editor Box -->
    <rect x="20" y="150" width="320" height="152" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="32" y="172" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">#game-grid { display: grid; }</text>
    <text x="32" y="194" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">.player-box {</text>
    
    <text x="44" y="216" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">grid-column-start: <tspan fill="#ffffff" font-weight="bold">1</tspan>;</text>
    <text x="44" y="238" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">grid-column-end:   <tspan fill="#6ee7b7" font-weight="bold">4</tspan>; <tspan fill="#94a3b8">/* 3 boxes */</tspan></text>
    <text x="44" y="260" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">grid-row-end:      <tspan fill="#6ee7b7" font-weight="bold">3</tspan>; <tspan fill="#94a3b8">/* 2 rows */</tspan></text>
    
    <text x="32" y="282" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">}</text>

    <!-- Pass Button -->
    <rect x="20" y="314" width="320" height="36" rx="6" fill="url(#greenBtn)" />
    <text x="180" y="336" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" text-anchor="middle">&#10003; Level 1 Passed &#8226; 3 Boxes Counted!</text>
  </g>

  <!-- Right Side: Grid Board with Numbers -->
  <g transform="translate(410, 108)" filter="url(#shadow)">
    <rect width="360" height="365" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="180" y="26" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">GRID CANVAS (4 COLUMNS &#215; 3 ROWS)</text>

    <g transform="translate(25, 42)">
      <rect width="310" height="260" rx="8" fill="#090e1a" stroke="#334155" stroke-width="2" />
      
      <!-- Top Column Line Labels (L1 to L5) -->
      <text x="25" y="-8" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">Line 1</text>
      <text x="95" y="-8" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">Line 2</text>
      <text x="165" y="-8" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">Line 3</text>
      <text x="235" y="-8" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">Line 4</text>
      <text x="290" y="-8" fill="#f59e0b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">Line 5</text>

      <!-- Left Row Line Labels (L1 to L4) -->
      <text x="-22" y="25" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" font-weight="bold">R1</text>
      <text x="-22" y="105" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" font-weight="bold">R2</text>
      <text x="-22" y="185" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" font-weight="bold">R3</text>
      <text x="-22" y="255" fill="#f59e0b" font-family="'Courier New', monospace" font-size="9" font-weight="bold">R4</text>

      <!-- Background Slots (Dashed Outlines) -->
      <!-- Row 1 -->
      <rect x="15" y="15" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="85" y="15" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="155" y="15" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="225" y="15" width="70" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="260" y="55" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (1,4)</text>

      <!-- Row 2 -->
      <rect x="15" y="95" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="85" y="95" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="155" y="95" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <rect x="225" y="95" width="70" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="260" y="135" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (2,4)</text>

      <!-- Row 3 -->
      <rect x="15" y="175" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="47" y="215" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (3,1)</text>
      <rect x="85" y="175" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="117" y="215" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (3,2)</text>
      <rect x="155" y="175" width="65" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="187" y="215" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (3,3)</text>
      <rect x="225" y="175" width="70" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />
      <text x="260" y="215" fill="#64748b" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Box (3,4)</text>

      <!-- The Active Expanded Box Covering Lines 1 to 4 and Rows 1 to 3 -->
      <rect x="15" y="15" width="205" height="150" rx="6" fill="url(#activeBox)" stroke="#6ee7b7" stroke-width="2" />
      <text x="117" y="78" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">&#11088; Spanned: Start Box 1 to End Box 3</text>
      <text x="117" y="98" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">grid-column: 1 / 4; (Line 1 to 4)</text>
      <text x="117" y="118" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">grid-row: 1 / 3; (Line 1 to 3)</text>
      <text x="117" y="138" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">3 Horizontal Boxes Counted &amp; Spanned</text>
    </g>

    <!-- Success Toast Notification -->
    <rect x="25" y="318" width="310" height="32" rx="6" fill="#064e3b" stroke="#04aa6d" stroke-width="1" />
    <text x="180" y="338" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">&#127881; SUCCESS: 3 Boxes Counted Across Lines 1 to 4!</text>
  </g>
</svg>
