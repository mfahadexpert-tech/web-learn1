<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geological Eras &amp; Events Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .table-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 600px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #2b5b9c;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
            border: 1px solid #94a3b8;
        }

        th, td {
            border: 1px solid #94a3b8;
            padding: 12px 16px;
            font-size: 15px;
        }

        th {
            background-color: #e2e8f0;
            font-weight: bold;
            color: #0f172a;
            text-transform: capitalize;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <h2>Geological Eras &amp; Events Table</h2>
        
        <table border="1">
            <thead>
                <tr>
                    <th>ereas</th>
                    <th colspan="2">events</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>mesozoic</td>
                    <td>evolution</td>
                    <td>235</td>
                </tr>
                <tr>
                    <td rowspan="2">events</td>
                    <td>away africa</td>
                    <td>135</td>
                </tr>
                <tr>
                    <td>away africa</td>
                    <td>135</td>
                </tr>
                <tr>
                    <td rowspan="3">events</td>
                    <td>away africa</td>
                    <td>135</td>
                </tr>
                <tr>
                    <td>away africa</td>
                    <td>135</td>
                </tr>
                <tr>
                    <td>away africa</td>
                    <td>135</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
